services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cms
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
      - ./sql/stored-procedures.sql:/docker-entrypoint-initdb.d/03-stored-procedures.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MONGO_URI: mongodb://mongo:27017/prescriptions
      JWT_SECRET: docker-compose-dev-secret-key-change-for-real-use-1234
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started

volumes:
  mysql-data:
  mongo-data:
