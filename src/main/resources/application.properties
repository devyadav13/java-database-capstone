server.port=8080
spring.application.name=smart-clinic

# MySQL (relational data)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# MongoDB (prescriptions)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/prescriptions}

# JWT (must be at least 32 characters; override in production)
jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-123456}
jwt.expiration-days=7

spring.thymeleaf.cache=false
